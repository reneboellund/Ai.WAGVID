selection_policy:
  - Keypoint and limb variants are challengers; upstream 93.5/93.6 results do not select a winner.
  - Compare both against identical rights-cleared validation media and split manifest when feasible.
  - FineGYM labels remain an upstream taxonomy, not FIG identities or D-values.
  - Official score/result fields must not enter inference or label mapping before AI output freeze.
  - No checkpoint is validated until exact bytes, hashes, rights/provenance and Ai.WAGVID benchmark report exist.

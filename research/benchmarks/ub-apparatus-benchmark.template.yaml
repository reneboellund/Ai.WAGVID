schema: ai.wagvid.apparatus-benchmark-manifest.v1
apparatus: UB
scope: post-routine-offline-validation
status: template
model_bundle_digest: REQUIRED
rulepack_digest: REQUIRED
validation_dataset_manifest_sha256: REQUIRED
split_manifest_sha256: REQUIRED
rights_ref: REQUIRED
hardware_runtime_manifest_sha256: REQUIRED
parameters:
  top_k: REQUIRED_BEFORE_EXECUTION
  ood_threshold_milli: REQUIRED_BEFORE_EXECUTION
required_slices:
  - ub-fixed-side
  - ub-broadcast-camera
  - ub-release-flight
  - ub-bar-change
  - ub-motion-blur
  - ub-partial-occlusion
  - ub-continuity-borderline
  - ub-bar-geometry-unavailable
promotion_metrics:
  - id: release-timing-error-ms
    direction: lower
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: regrasp-timing-error-ms
    direction: lower
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: bar-identity-accuracy-milli
    direction: higher
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: contact-state-accuracy-milli
    direction: higher
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: topk-element-recall-milli
    direction: higher
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: continuity-state-agreement-milli
    direction: higher
    threshold: REQUIRED_BEFORE_EXECUTION
  - id: unknown-ood-detection-milli
    direction: higher
    threshold: REQUIRED_BEFORE_EXECUTION
notes:
  - Threshold values must be frozen before execution.
  - Temporal adjacency alone is not connection evidence; continuity metrics use explicit release/regrasp/contact topology labels.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wagvid"
version = "0.1.0"
description = "AI-assisted WAG post-event video analysis and scoring research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary/Research - license to be defined"}
authors = [{name = "Ai.WAGVID project"}]
dependencies = [
  "Django>=5.2,<6.0",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1"
]
model-mediapipe = ["mediapipe>=0.10,<0.11"]
model-yolo = ["ultralytics>=8.3,<9"]
wasabi = ["boto3>=1.35,<2"]
# MMPose/MMAction2 belong in a separately pinned worker environment because
# their Torch/CUDA matrix must match the worker image and accelerator.

[project.scripts]
wagvid-rules = "wagvid_rules.validation:main"
wagvid = "ai_wagvid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "wagvid_web.settings"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["RUF012"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-wagvid"
version = "0.0.1"
description = "AI-assisted WAG video analysis and judging research platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary/Research - license to be defined"}
authors = [{name = "Ai.WAGVID project"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4.23"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

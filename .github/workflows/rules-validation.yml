name: Rules validation

on:
  pull_request:
    paths:
      - ".github/workflows/rules-validation.yml"
      - "pyproject.toml"
      - "rules/**"
      - "schemas/**"
      - "src/wagvid_rules/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rules-validation.yml"
      - "pyproject.toml"
      - "rules/**"
      - "schemas/**"
      - "src/wagvid_rules/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Validate source registry
        run: wagvid-rules validate rules/registry.yaml

      - name: Validate draft rule-pack manifest
        run: >-
          wagvid-rules manifest rules/rulepack-manifest.example.yaml
          --registry rules/registry.yaml

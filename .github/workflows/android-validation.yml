name: Android validation

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Compile debug app and run unit tests
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

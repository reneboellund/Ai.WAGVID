<!doctype html>
<html lang="da">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Ai.WAGVID{% endblock %}</title>
<style>body{margin:0;font:16px system-ui;background:#07101e;color:#eaf8f5}a{color:#18d4a3}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}nav{background:#111c31;padding:24px}nav a{display:block;padding:10px 0}main{padding:28px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:#111c31;border-radius:18px;padding:18px}.danger{color:#ff5d6c}.warning{color:#ffb84d}.primary{background:#18d4a3;color:#07101e;border:0;border-radius:12px;min-height:48px;padding:0 18px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #263852}input,select{min-height:44px;width:100%;max-width:520px;margin:4px 0 14px}</style></head>
<body><div class="shell"><nav><h2>Ai.WAGVID</h2><a href="{% url 'dashboard' %}">Overblik</a><a href="{% url 'operate' %}">Operér</a><a href="{% url 'competitions' %}">Konkurrencer</a><a href="{% url 'gymnasts' %}">Gymnaster</a><a href="{% url 'devices' %}">Enheder</a><a href="{% url 'analyses' %}">Analyser</a><a href="{% url 'exchange' %}">Import/eksport</a><a href="{% url 'system-status' %}">Systemstatus</a><a href="{% url 'storage-settings' %}">Wasabi storage</a><a href="/admin/maintenance/">Administration</a></nav><main>{% if messages %}{% for message in messages %}<div class="card">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></div></body></html>
